<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Vibrant gradient for the cloud shape using original coral/gold scheme -->
    <linearGradient id="c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Bottom rim light gradient fading upwards -->
    <linearGradient id="rim-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffea00" stop-opacity=".9"/>
      <stop offset="40%" stop-color="#ffaa00" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </linearGradient>
    <!-- Warm-tone ambient shadow filter -->
    <filter id="b" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#ff0055" flood-opacity=".5"/>
    </filter>
    <filter id="e" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#fff" flood-opacity=".3"/>
    </filter>
    <!-- Blur filter for soft inner rim glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
    </filter>
  </defs>

  <!-- Main Fluffy Cloud Shape Base -->
  <g filter="url(#b)">
    <path d="M 180,420 
             A 60,60 0 0,1 150,310 
             A 75,75 0 0,1 250,200 
             A 100,100 0 0,1 420,220 
             A 75,75 0 0,1 450,340 
             A 60,60 0 0,1 420,420 
             Z" fill="url(#c)"/>
  </g>

  <!-- Glowing Bottom Rim Light Overlay mapped to Cloud Floor -->
  <path d="M 180,420 A 60,60 0 0,1 150,310 A 10,10 0 0,1 160,315 A 50,50 0 0,0 190,410 L 410,410 A 50,50 0 0,0 440,345 A 10,10 0 0,1 450,340 A 60,60 0 0,1 420,420 Z" fill="url(#rim-gradient)" filter="url(#glow)"/>
  
  <!-- Crisp Inner Bottom Rim Accent Line along the flat base -->
  <line x1="190" y1="415" x2="410" y2="415" stroke="#fff" stroke-width="2" opacity="0.3" style="mix-blend-mode: overlay;" stroke-linecap="round"/>

  <!-- Upper Glass Highlight hugging the top cloud puffs -->
  <path d="M 165,295 A 75,75 0 0,1 250,200 A 100,100 0 0,1 420,220 A 75,75 0 0,1 435,315" fill="none" stroke="url(#d)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stylish & Professional Call Icon (Handset + Dual Soundwaves) -->
  <g filter="url(#e)" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sleek Minimalist Handset -->
    <path d="M 245,280 
             C 240,285 242,295 249,306 
             C 259,322 274,338 290,346 
             C 301,352 311,352 315,346 
             L 330,331 
             C 334,327 328,319 321,313 
             L 313,321 
             C 310,323 306,323 302,319 
             C 294,312 284,301 278,293 
             C 274,289 274,285 277,282 
             L 285,274 
             C 279,267 271,261 267,265 
             Z" />
             
    <!-- Wave 1 (Inner Broadcast Arc) -->
    <path d="M 315,250 A 45,45 0 0,1 365,300" stroke-width="10" />
    
    <!-- Wave 2 (Outer Broadcast Arc) -->
    <path d="M 335,225 A 75,75 0 0,1 410,300" stroke-width="10" />
  </g>
</svg>
